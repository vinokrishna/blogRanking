[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-ranking"
version = "1.0.0"
description = "Rank blog posts for a quarterly award, adjusting for how long each post has been live."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
blog-ranking = "blog_ranking:main"

[tool.setuptools]
py-modules = ["blog_ranking"]
